<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HP Scanner — POS Herbal</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f6f7f9] p-4">
<h1 class="font-bold text-lg flex items-center gap-2"><span class="w-8 h-8 bg-[#6366f1] text-white rounded-lg flex items-center justify-center">📱</span> HP sebagai Scanner</h1>
<p class="text-xs text-slate-500 mt-1">Scan barcode di HP, otomatis masuk ke Kasir di PC (1 WiFi).</p>
<div id="reader" class="mt-4 bg-white border rounded-2xl overflow-hidden"></div>
<div class="mt-3 flex gap-2"><input id="manual" placeholder="Ketik barcode manual" class="flex-1 border rounded-xl px-3 py-2"><button onclick="kirim(manual.value)" class="bg-[#6366f1] text-white px-4 rounded-xl">Kirim</button></div>
<div id="log" class="mt-3 text-xs space-y-1 max-h-[200px] overflow-auto bg-white border rounded-xl p-2"></div>
<div class="mt-3 text-xs bg-amber-50 border p-2 rounded-xl">Cara: 1) PC & HP 1 WiFi. 2) Buka di HP: <b id="url"></b> 3) Scan, otomatis tambah di Kasir PC.</div>
<script>
const urlEl=document.getElementById('url'); urlEl.textContent=location.origin + '/scan-phone.html';
function log(m){ const el=document.getElementById('log'); el.innerHTML='<div>'+new Date().toLocaleTimeString()+' - '+m+'</div>'+el.innerHTML; }
async function kirim(code){
  code=(code||'').trim(); if(!code) return;
  try{ const r=await fetch('/api/phone-scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}); const j=await r.json(); log('✓ Terkirim: '+code); if(navigator.vibrate) navigator.vibrate(80); document.getElementById('manual').value=''; }catch(e){ log('✗ Gagal: '+e.message); }
}
let qr=new Html5Qrcode("reader");
qr.start({facingMode:"environment"},{fps:10,qrbox:250}, (decoded)=>{
  kirim(decoded);
},{});
</script>
</body></html>
